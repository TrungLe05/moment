# Docker Compose cho môi trường dev (T-104): chỉ chạy các dịch vụ hạ tầng.
# Backend và frontend chạy trên máy (IDE, ./mvnw, npm run dev) để sửa code nhanh.
# Production dùng file compose riêng ở deploy/ (T-164).
#
# Cách dùng: cp .env.example .env, đổi mật khẩu, rồi `docker compose up -d`.
# Mọi cổng chỉ mở trên 127.0.0.1 để không lộ ra mạng LAN.

name: moment

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage chuẩn S3 thay cho MinIO, vì MinIO đã ngừng phát hành image (D-010).
  # Production dùng Cloudflare R2; code chỉ nói chuyện qua giao thức S3 nên không phụ thuộc RustFS.
  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Thiếu S3_ACCESS_KEY trong .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Thiếu S3_SECRET_KEY trong .env}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Chạy một lần: tạo bucket riêng tư cho ảnh/video nếu chưa có.
  storage-init:
    image: amazon/aws-cli:2.40.3
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Thiếu S3_BUCKET trong .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$S3_BUCKET"
    restart: "no"

  # SMTP giả cho dev (D-008): bắt mọi email, xem ở http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  rustfs-data:
