# Cấu hình chung. Giá trị bí mật luôn lấy từ biến môi trường, không ghi vào đây.
spring:
  application:
    name: moment
  profiles:
    # Không chọn profile thì chạy như container API; container worker chạy với profile worker (ADR 0003).
    default: api
  config:
    # Khi dev: đọc .env ở gốc repo (chạy từ gốc hoặc từ backend/). Không có file thì bỏ qua,
    # nên container và CI chỉ dùng biến môi trường thật.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # Production đặt DB_URL, DB_USERNAME, DB_PASSWORD; dev dựng từ các biến POSTGRES_* của Compose.
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:moment}}
    username: ${DB_USERNAME:${POSTGRES_USER:moment}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    # Schema chỉ đổi qua Flyway; Hibernate chỉ kiểm tra entity khớp bảng.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_SMTP_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Gọi dịch vụ ngoài phải có timeout (CLAUDE.md); đơn vị mili giây.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  messages:
    basename: messages
    # Không lấy ngôn ngữ của máy chủ làm dự phòng: thiếu bản dịch thì dùng messages.properties (en).
    fallback-to-system-locale: false

moment:
  # Job định kỳ (DB mục 9) chạy trong tiến trình API; test tắt để tự gọi từng job.
  housekeeping:
    enabled: true
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY:}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@moment.local}
  storage:
    # Khi dev trỏ vào RustFS trong Compose; production là Cloudflare R2.
    endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:9000}}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:moment}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  media:
    # Worker cần ffmpeg và ffprobe (D-034); mặc định tìm trong PATH.
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    # Một lệnh ffmpeg chạy quá lâu thì dừng và thử lại sau (ADR 0003).
    process-timeout: 2m
  cors:
    # Danh sách origin cách nhau bằng dấu phẩy.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  pattern:
    # Gắn request id vào mỗi dòng log (RequestIdFilter).
    level: "%5p [%X{requestId:-}]"

management:
  health:
    mail:
      # SMTP chậm hay tạm lỗi không làm container bị coi là hỏng; email gửi lại được (AuthMailer).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
