# CI/CD (T-109, D-011)
# - Mọi pull request và push lên main, develop, release/*: test backend, kiểm tra và build frontend.
# - Đẩy image backend lên Docker Hub: đang tạm tắt đến khi release v1 (D-013), xem job cuối file.
# Chưa có bước triển khai lên VPS (chờ Q-010, T-166).
#
# Cần tạo trong GitHub → Settings → Secrets and variables → Actions:
#   Variables: DOCKERHUB_USERNAME  tên tài khoản Docker Hub (cũng là namespace của image)
#   Secrets:   DOCKERHUB_TOKEN     Personal access token của Docker Hub, quyền Read & Write

name: CI

on:
  push:
    # Theo mô hình nhánh D-012: main, develop và nhánh release.
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend · build và test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Testcontainers dùng Docker có sẵn trên runner ubuntu để chạy PostgreSQL thật.
      # Gọi qua sh vì commit từ Windows thường không giữ quyền thực thi của mvnw.
      - name: Build và test
        run: sh ./mvnw -B verify

      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend · lint, kiểm tra kiểu, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Bản xuất tĩnh để kiểm tra hoặc triển khai sau; cách phục vụ ở production chờ Q-021.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-static
          path: frontend/out/
          retention-days: 7

  # TẠM TẮT (D-013): chưa có chức năng ổn định nên chưa phát hành image.
